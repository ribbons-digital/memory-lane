name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Run tests
        run: pnpm test

  windows-self-maintenance:
    name: windows self-maintenance smoke
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Test Windows config paths, cleanup retries, and deferred uninstall identity
        run: node --test --import tsx packages/cli/test/mcp.test.ts packages/cli/test/uninstall-binary.test.ts packages/cli/test/windows-smoke-cleanup.test.ts

      - name: Exercise running executable replacement and removal repeatedly
        timeout-minutes: 30
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 2; $attempt++) {
            Write-Host "Windows self-maintenance smoke attempt $attempt of 2"
            node --import tsx scripts/windows-self-maintenance-smoke.ts
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

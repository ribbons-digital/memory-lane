name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          no-cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Build binaries
        run: bun scripts/build-binaries.ts

      - name: Smoke test Linux binary
        run: bun scripts/smoke-binary.ts

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: |
            dist-binaries/*.tar.gz
            dist-binaries/*.zip
            dist-binaries/SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  native-smoke:
    name: Native artifact smoke (${{ matrix.name }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux arm64
            os: ubuntu-24.04-arm
            archive: memory-lane-linux-arm64.tar.gz
          - name: macOS arm64
            os: macos-15
            archive: memory-lane-darwin-arm64.tar.gz
          - name: macOS x64
            os: macos-15-intel
            archive: memory-lane-darwin-x64.tar.gz
          - name: Windows x64
            os: windows-latest
            archive: memory-lane-windows-x64.exe.zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          no-cache: true

      - name: Download release artifacts
        uses: actions/download-artifact@v5
        with:
          name: release-binaries
          path: dist-binaries

      - name: Extract Linux or macOS release archive
        if: runner.os != 'Windows'
        run: tar -xzf "dist-binaries/${{ matrix.archive }}" -C dist-binaries

      - name: Extract Windows release archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: Expand-Archive -LiteralPath "dist-binaries/${{ matrix.archive }}" -DestinationPath dist-binaries -Force

      - name: Smoke test extracted release binary
        run: bun scripts/smoke-binary.ts

  release:
    name: Publish release
    needs:
      - build
      - native-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download release artifacts
        uses: actions/download-artifact@v5
        with:
          name: release-binaries
          path: dist-binaries

      - name: Generate release notes
        run: |
          tag="${GITHUB_REF_NAME}"
          previous_tag="$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)"

          {
            echo "## What's changed"
            echo
            if [ -n "$previous_tag" ]; then
              git log --pretty=format:'- %s (%h)' "${previous_tag}..${tag}"
            else
              git log --pretty=format:'- %s (%h)' "${tag}"
            fi
            echo
            echo
            echo "## Verification"
            echo
            echo "- Built packages with \`pnpm build\`"
            echo "- Ran test suite with \`pnpm test\`"
            echo "- Built release binaries"
            echo "- Smoke-tested the Linux x64 binary on the build runner"
            echo "- Smoke-tested packaged Linux arm64, macOS arm64/x64, and Windows x64 binaries on matching native runners"
            echo
            echo "## Assets"
            echo
            echo "- macOS arm64/x64 binaries"
            echo "- Linux arm64/x64 binaries"
            echo "- Windows x64 binary"
            echo "- \`install.sh\`, \`install.ps1\`, and \`SHA256SUMS\`"
            if [ -n "$previous_tag" ]; then
              echo
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${previous_tag}...${tag}"
            fi
          } > RELEASE_NOTES.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            dist-binaries/*.tar.gz
            dist-binaries/*.zip
            dist-binaries/SHA256SUMS
            install.sh
            install.ps1
